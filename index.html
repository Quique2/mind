<style>
  :root {
    --teal:#29A3C7; --azul:#2E4BC6; --profundo:#232D93; --tinta:#232D93;
    --crema:#F5EFD8; --blanco:#ffffff;
    --pastilla:rgba(79,179,217,0.4); --borde:rgba(255,255,255,0.5);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    background:linear-gradient(150deg, var(--teal) 0%, var(--azul) 55%, var(--profundo) 100%);
    font-family:'Poppins','Segoe UI',system-ui,sans-serif; color:var(--blanco);
    padding:0 20px 40px; position:relative; overflow-x:hidden;
  }
  .deco { position:absolute; pointer-events:none; }
  .topbar {
    width:100%; max-width:640px; display:flex; justify-content:space-between;
    align-items:center; padding:22px 0 0; position:relative; z-index:2;
  }
  .life { font-size:13px; font-weight:600; line-height:1.25; }
  .life span { font-weight:400; opacity:.85; }
  .handle {
    background:var(--pastilla); border:1.5px solid var(--borde);
    border-radius:999px; padding:8px 18px; font-size:14px; font-weight:600; color:var(--blanco);
    text-decoration:none;
  }
  main { width:100%; max-width:430px; text-align:center; position:relative; z-index:2; }
  .logocard {
    background:rgba(255,255,255,0.95); border-radius:28px;
    padding:20px 24px 10px; display:inline-block; margin-top:26px;
    box-shadow:0 10px 30px rgba(10,20,80,0.35);
  }
  .logocard svg { width:132px; height:auto; display:block; }
  h1 { font-size:2.6rem; font-weight:800; letter-spacing:.18em; margin:14px 0 0 -.18em; text-indent:.18em; }
  p.tag  { font-weight:600; font-size:1.05rem; margin-top:2px; }
  p.tag2 { color:var(--crema); opacity:.9; margin:2px 0 26px; font-size:.9rem; font-weight:400; }
  a.btn {
    display:flex; align-items:center; gap:14px; text-decoration:none;
    border-radius:999px; padding:15px 22px; margin:14px 0;
    font-weight:700; font-size:1.05rem; min-height:44px;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  a.btn:hover { transform:translateY(-2px); }
  a.btn.primaria {
    background:var(--blanco); color:var(--profundo);
    box-shadow:0 8px 22px rgba(10,20,80,0.4);
  }
  a.btn.secundaria {
    background:var(--pastilla); border:1.5px solid var(--borde); color:var(--blanco);
    font-weight:600;
  }
  a.btn svg { width:26px; height:26px; flex:none; }
  a.btn span { flex:1; text-align:center; margin-right:26px; }
  .puntos { display:flex; justify-content:center; gap:10px; margin-top:26px; }
  .puntos i { width:10px; height:10px; border-radius:50%; display:block; }
  footer { margin-top:22px; font-size:.8rem; color:var(--crema); opacity:.65; position:relative; z-index:2; }
</style>
